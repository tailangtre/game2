        function bestOperator () {
            // Get value from querystring param
            var getQueryParamValue = function (queryString, parameter) {
                if (queryString && parameter) {
                    var queryVars;
                    if (/\?/.test(queryString)) {
                        queryVars = queryString.split("?")[1];
                    }
                    var pairs = queryVars.split("&");
                    for (var i = 0; i < pairs.length; i++) {
                        if (pairs[i].substring(0, pairs[i].indexOf("=")) == parameter) {
                                return pairs[i].substring((pairs[i].indexOf("=") + 1));
                        }
                    }
                }
                return "";
            };
            // Define which api to use (Version 4)
            var apiFile = "leandergmapi/4/LeanderApiLoader.php";
            // Get LeanderGMApi scripts Path
            var queryString = document.location.search || document.location.hash;
            var apiPath = decodeURIComponent(getQueryParamValue(queryString, "apiAddress"));
            // Check if URL is a valid LeanderGMApi Path
            if (apiPath) {
                // Remove special chars that are not valid for URL's
                var regExp = new RegExp("/[\"'<>=?\[\]\{\}]/gi");
                if (regExp.test(apiPath)) {
                    // URL not valid. Try relative path
                    apiPath = "../../";
                }
            } else {
                // URL not valid. Try relative path
                apiPath = "../../";
            }
            
            // Add LeanderGMApi script
            loadScript(apiPath + apiFile)
            .then(function() {
                // setTimeout(startGame, 3000);
				setTimeout(initGame, 1000);
            })
            .catch(function(error) {
                AppConstants.BEST_OPERATOR = false;
                startGame();
            });

        function loadScript(src) {
            return new Promise(function(resolve, reject) {
                var script = document.createElement("script");
                script.type = "text/javascript";
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

				var mobileDevice = /Android|iPhone|iPad|iPod|IEMobile|BlackBerry|Opera Mini/i.test(navigator.userAgent);
				var portrait = mobileDevice && window.innerHeight > window.innerWidth;
				var stageWidth = portrait ? 720 : 1280;
				var stageHeight = portrait ? 1280 : 720;
				var scale = Math.min(window.innerWidth / stageWidth, window.innerHeight / stageHeight);
				stage.classList.toggle('boot-portrait', portrait);
				stage.style.width = stageWidth + 'px';
				stage.style.height = stageHeight + 'px';
				stage.style.left = ((window.innerWidth - (stageWidth * scale)) / 2) + 'px';
				stage.style.top = ((window.innerHeight - (stageHeight * scale)) / 2) + 'px';
				stage.style.transform = 'scale(' + scale + ')';
			}
		}

		function parseURLParameters() {
            // Get the URL query string
            const queryString = window.location.search;
            
            // Check if there are no parameters
            if (!queryString) {
                return {};
            }
        
            // Remove the leading '?' character
            const cleanedQueryString = queryString.slice(1);
        
            // Split the query string into an array of key-value pairs
            const keyValuePairs = cleanedQueryString.split('&');
            
            // Initialize an empty object to store the parameters
            const parameters = {};
        
            // Iterate through the key-value pairs
            for (const pair of keyValuePairs) {
            const [key, value] = pair.split('=');
            
            // Decode the URI component and assign it to the object
            parameters[key] = decodeURIComponent(value);
            }
        
            return parameters;
        }

		function myBrowser(){
			var userAgent = navigator.userAgent.toLowerCase(); //取得浏览器的userAgent字符串
			var isOpera = userAgent.indexOf("opr") > -1;
			if (isOpera) {
				return "opera"
			}; //判断是否Opera浏览器
			if (userAgent.indexOf("firefox") > -1) {
				return "ff";
			} //判断是否Firefox浏览器
			if (userAgent.indexOf("chrome") > -1){
				return "chrome";
			}
			if (userAgent.indexOf("safari") > -1) {
				return "safari";
			} //判断是否Safari浏览器
			if (userAgent.indexOf("compatible") > -1 && userAgent.indexOf("msie") > -1 && !isOpera) {
				return "ie";
			}; //判断是否IE浏览器
		}

		function getQueryString(name) {
			var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
			var r = window.location.search.substr(1).match(reg);
			if (r != null) return unescape(r[2]);
			return null;
		}

		function switchLang (lang) {
			var url = window.location+"";
			var oldLang = getQueryString('lang');
			if(!oldLang){
				if(oldLang==''){
					var reg = new RegExp("(^|&)lang=([^&]*)(&|$)", "i");
					url = url.replace(reg,"&lang="+lang+"&");
				}
				else{
					url = url+"&lang="+lang;
				}
			}
			else{
				var reg = new RegExp("(^|&)lang=([^&]*)(&|$)", "i");
				url = url.replace(reg,"&lang="+lang+"&");
			}

			window.location.href = url;
		}
