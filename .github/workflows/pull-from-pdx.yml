name: Pull from PDX-Slots-Games

on:
  workflow_dispatch:
    inputs:
      studio_branch:
        description: "Studio branch to update"
        required: true
        default: "main"
      pdx_branch:
        description: "PDX branch to pull from"
        required: true
        default: "dev"
      centralized_commit:
        description: "Optional: specific commit SHA from centralized repo to cherry-pick"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pull-from-pdx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Studio Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "Studio Sync Bot"
          git config user.email "studio-bot@pdxslots.com"

      - name: Generate GitHub App Token
        id: token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ vars.GIT_APP_ID }}
          private_key: ${{ secrets.GIT_APP_KEY }}
          installation_id: ${{ secrets.GIT_APP_INSTALLATION_ID }}

      - name: Verify token exists
        run: |
          if [ -z "${{ steps.token.outputs.token }}" ]; then
            echo "Token output is empty"
            exit 1
          fi
          echo "Token was generated"
    
      - name: Add PDX remote
        run: |
          git remote remove pdx || true
          git remote add pdx https://x-access-token:${{ steps.token.outputs.token }}@github.com/PDX-Slots-Games/game2.git
          git remote -v
          
      - name: Show remotes
        run: |
          git remote -v
          git remote get-url pdx
        
      - name: Test PDX remote
        run: |
          git ls-remote pdx

      - name: Fetch PDX Branch
        run: |
          git fetch pdx ${{ inputs.pdx_branch }}

      - name: Merge or Cherry-pick from PDX
        run: |
          if [ -n "${{ inputs.centralized_commit }}" ]; then
            echo "Cherry-picking commit ${{ inputs.centralized_commit }}"
            git cherry-pick ${{ inputs.centralized_commit }}
          else
            echo "Merging pdx/${{ inputs.pdx_branch }} into ${{ inputs.studio_branch }}"
            git merge --no-ff pdx/${{ inputs.pdx_branch }} -m "Merge from PDX-Slots-Games/${{ inputs.pdx_branch }}"
          fi

      - name: Authenticate origin for push
        run: |
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git remote -v

      - name: Push back to Studio Repo
        run: |
          git push origin HEAD:${{ inputs.studio_branch }}
